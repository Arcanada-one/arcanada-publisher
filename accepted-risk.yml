  - id: tos-facebook
    description: >-
      Facebook Platform Terms restrict automation of the platform. This
      project automates only the operator's own personal profile via a
      Playwright session authenticated once in headed mode by the operator;
      no Graph API misuse, no scraping of others' content, no fake-account
      workflows. Posture: browser automation, single-user assistive, no
      circumvention of platform anti-bot or rate-limit controls. ToS risk is
      borne by the operator.
    severity: high
    accepted_by: paxbeach@gmail.com
    accepted_on: 2026-05-21
    expires: 2026-08-19
