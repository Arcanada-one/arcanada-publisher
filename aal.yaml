project: arcanada-publisher
spec: https://github.com/Arcanada-one/datarim/blob/main/documentation/mandates/aal-mandate.md
current_aal: L1
target_aal: L2
last_validated: 2026-05-21
public_page: https://arcanada.one/publisher/aal

weakest_links:
  - cookie-expiry-detection
  - tos-aware-rate-limiting
  - screenshot-on-fail-forensics

milestones:
  L1-baseline:
    status: in_progress
    description: Operator-initiated CLI; one command per publish; persistent profile login is a manual step.
    covers:
      - core-contracts
      - facebook-adapter
      - linkedin-adapter
      - x-adapter
      - reddit-adapter
      - vkontakte-adapter
  L2-agent-callable:
    # The four L2 controls are BUILT and TESTED; the L1->L2 flip is deferred
    # until the gate_criteria below hold in practice (operator decision: build
    # the mechanisms now, flip later after a real observation window). The
    # surface is honest-limited until then — not advertised as agent-callable L2.
    status: planned
    description: Loopback HTTP API allows local agents (Claude Code / Codex) to publish under explicit, audited policy.
    requires:
      audit-log-per-publish: implemented # core/src/audit.ts (JSONL, 0600, allowlisted)
      cost-circuit-breaker-per-platform: implemented # core/src/rate-limit.ts (sliding hour window)
      drift-detection-cron: implemented # .github/workflows/dogfood.yml (verify body deferred)
      tool-scoping-input-validation: implemented # core/src/tool-scoping.ts (length/MIME/profile)
    gate_criteria:
      - thirty-days-no-aal-drift-events
      - ten-successful-agent-callable-publishes-with-audit-ref
      - cost-circuit-breaker-triggered-at-least-once

out_of_scope:
  - L3-autonomous-schedule
  - L3-content-generation
