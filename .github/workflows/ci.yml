name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + Format
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm exec prettier --check "**/*.{ts,md,json,yml,yaml}"

  typecheck:
    name: TypeScript
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests (vitest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r test

  audit:
    name: Dependency audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  shell:
    name: Shell (shellcheck + bats)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build # bridge round-trip drives the built CLI
      # Install shellcheck — static binary, no root/apt required (ludeeus/action-shellcheck
      # downloads a prebuilt release tarball and adds it to PATH automatically).
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0
          check_together: 'yes'
        env:
          SHELLCHECK_OPTS: ''
      # Install bats-core via git-clone into $HOME/.bats — rootless, version-pinned.
      # Idempotent: remove any previous install first so the exact tag is always present.
      - name: Install bats-core v1.13.0
        run: |
          rm -rf "$HOME/.bats"
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$HOME/.bats-src"
          bash "$HOME/.bats-src/install.sh" "$HOME/.bats"
          rm -rf "$HOME/.bats-src"
          echo "$HOME/.bats/bin" >> "$GITHUB_PATH"
      - run: shellcheck dev-tools/*.sh examples/*/publish.sh
      - run: bats tests/dev-tools tests/examples
