name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + Format
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm exec prettier --check "**/*.{ts,md,json,yml,yaml}"

  typecheck:
    name: TypeScript
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests (vitest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r test

  audit:
    name: Dependency audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  shell:
    name: Shell (shellcheck + bats)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build # bridge round-trip drives the built CLI
      # Install shellcheck — official static binary, no root/apt required.
      # NB: install the binary only; do NOT use an auto-linting action — those
      # recursively scan the whole tree (incl. node_modules/.bin/* npm wrappers),
      # which fails on unrelated SC2006 warnings. We lint a controlled file set below.
      - name: Install shellcheck v0.11.0
        run: |
          ver=v0.11.0
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/shellcheck-${ver}/shellcheck" "$HOME/.local/bin/shellcheck"
          rm -rf "$tmp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Install bats-core via git-clone into $HOME/.bats — rootless, version-pinned.
      # Idempotent: remove any previous install first so the exact tag is always present.
      - name: Install bats-core v1.13.0
        run: |
          rm -rf "$HOME/.bats"
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$HOME/.bats-src"
          bash "$HOME/.bats-src/install.sh" "$HOME/.bats"
          rm -rf "$HOME/.bats-src"
          echo "$HOME/.bats/bin" >> "$GITHUB_PATH"
      - run: shellcheck dev-tools/*.sh examples/*/publish.sh
      - run: bats tests/dev-tools tests/examples
